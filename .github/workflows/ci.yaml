name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system:
          - 'ubuntu-latest'
        php:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        symfony:
            - '4.*'
            - '5.*'
            - '6.*'
        dependency:
            - 'lowest'
            - 'highest'

        # Exclude invalid combinations
        exclude:
            # Symfony 6.* requires PHP >= 8.1
            - php: '7.4'
              symfony: '6.*'
            - php: '8.0'
              symfony: '6.*'
            # Symfony 4.* lowest doesn't support PHP 8.2+
            - php: '8.2'
              symfony: '4.*'
              dependency: 'lowest'
            - php: '8.3'
              symfony: '4.*'
              dependency: 'lowest'
            - php: '8.4'
              symfony: '4.*'
              dependency: 'lowest'

    name: PHP ${{ matrix.php }} with ${{ matrix.dependency }} dependencies tests on ${{ matrix.operating-system }}

    steps:
      - name: Setup PHP version ${{ matrix.php }} on ${{ matrix.operating-system }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ramsey/composer-install@v2
        with:
          dependency-versions: ${{ matrix.dependency }}

      - name: Run all tests
        run: composer test
